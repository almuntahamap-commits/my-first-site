<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Al-Muntaha for Advertising and Production (MAP)</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS CDN (v3 for standalone compatibility) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        charcoal: "#121212",
                        "charcoal-light": "#1A1A1A",
                        gold: "#D4AF37",
                        "gold-light": "#F9E076",
                    },
                    fontFamily: {
                        serif: ["Playfair Display", "serif"],
                        sans: ["Inter", "sans-serif"],
                    },
                    animation: {
                        'slow-zoom': 'slow-zoom 20s ease-in-out infinite alternate',
                        'marquee': 'marquee 20s linear infinite',
                    },
                    keyframes: {
                        'slow-zoom': {
                            '0%': { transform: 'scale(1)' },
                            '100%': { transform: 'scale(1.1)' },
                        },
                        'marquee': {
                            '0%': { transform: 'translateX(0)' },
                            '100%': { transform: 'translateX(-50%)' },
                        }
                    }
                }
            }
        }
    </script>

    <style type="text/tailwindcss">
        @layer base {
            body {
                @apply bg-charcoal text-white antialiased;
            }
        }

        @layer components {
            .glass {
                background: rgba(26, 26, 26, 0.4);
                backdrop-filter: blur(12px);
                border: 1px solid rgba(212, 175, 55, 0.1);
            }

            .glass-hover:hover {
                background: rgba(212, 175, 55, 0.05);
                border: 1px solid rgba(212, 175, 55, 0.3);
            }

            .gold-gradient {
                background: linear-gradient(135deg, #D4AF37 0%, #F9E076 50%, #D4AF37 100%);
            }

            .gold-text-gradient {
                background: linear-gradient(135deg, #D4AF37 0%, #F9E076 50%, #D4AF37 100%);
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
            }
        }

        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #121212;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(212, 175, 55, 0.1);
            border-radius: 99px;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <!-- React and Dependencies -->
    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom": "https://esm.sh/react-dom@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "framer-motion": "https://esm.sh/framer-motion@10.16.4",
        "lucide-react": "https://esm.sh/lucide-react@0.284.0"
      }
    }
    </script>

    <script type="module">
        import React, { useState, useEffect } from 'react';
        import { createRoot } from 'react-dom/client';
        import { motion, AnimatePresence } from 'framer-motion';
        import { 
            Lock, Play, Camera, Film, PenTool, Search, Mic, 
            Headphones, CreditCard, Star, CheckCircle2, Volume2, 
            Menu, ChevronRight, Sparkles, Database 
        } from 'lucide-react';

        const SectionHeading = ({ children, subtitle }) => (
            <div className="mb-12">
                {subtitle && (
                    <span className="text-gold text-xs font-semibold tracking-widest uppercase mb-2 block animate-pulse">
                        {subtitle}
                    </span>
                )}
                <h2 className="text-4xl md:text-5xl font-serif text-white tracking-tight">
                    {children}
                </h2>
                <div className="h-1 w-24 bg-gold mt-4 rounded-full" />
            </div>
        );

        const GlassCard = ({ children, className = "" }) => (
            <motion.div 
                whileHover={{ y: -5 }}
                className={`glass rounded-2xl p-6 transition-all duration-500 overflow-hidden relative group ${className}`}
            >
                <div className="absolute inset-0 bg-gold/5 opacity-0 group-hover:opacity-100 transition-opacity duration-500" />
                {children}
            </motion.div>
        );

        const LockedOverlay = () => (
            <div className="absolute inset-0 bg-black/60 backdrop-blur-sm flex flex-col items-center justify-center z-10 opacity-0 group-hover:opacity-100 transition-opacity duration-300">
                <div className="p-4 bg-gold/20 rounded-full border border-gold/30 mb-3">
                    <Lock className="w-6 h-6 text-gold" />
                </div>
                <span className="text-gold font-medium text-sm tracking-wide">Locked - Subscribe to Access</span>
            </div>
        );

        const App = () => {
            const [activeTab, setActiveTab] = useState("all");
            const [scrolled, setScrolled] = useState(false);

            useEffect(() => {
                const handleScroll = () => setScrolled(window.scrollY > 50);
                window.addEventListener("scroll", handleScroll);
                return () => window.removeEventListener("scroll", handleScroll);
            }, []);

            return (
                <div className="min-h-screen selection:bg-gold selection:text-charcoal bg-charcoal">
                    {/* Navigation */}
                    <nav className={`fixed top-0 w-full z-50 transition-all duration-500 ${scrolled ? 'bg-charcoal/90 backdrop-blur-xl border-b border-gold/10 py-4' : 'bg-transparent py-8'}`}>
                        <div className="container mx-auto px-6 flex justify-between items-center">
                            <div className="flex items-center gap-3">
                                <div className="w-10 h-10 gold-gradient rounded-lg flex items-center justify-center shadow-lg shadow-gold/20">
                                    <span className="text-charcoal font-bold text-xl">M</span>
                                </div>
                                <span className="text-2xl font-serif font-bold gold-text-gradient tracking-tighter">MAP</span>
                            </div>
                            
                            <div className="hidden lg:flex items-center gap-8">
                                {["Academy", "Script Lab", "Casting", "Audio Lab", "Subscription"].map((link) => (
                                    <a key={link} href={`#${link.toLowerCase().replace(" ", "-")}`} className="text-sm font-medium text-white/70 hover:text-gold transition-colors tracking-wide">
                                        {link}
                                    </a>
                                ))}
                            </div>

                            <div className="flex items-center gap-4">
                                <button className="hidden sm:block text-sm font-semibold text-white/90 hover:text-gold transition-colors">
                                    Log In
                                </button>
                                <button className="px-6 py-2.5 gold-gradient text-charcoal font-bold text-sm rounded-full shadow-lg shadow-gold/20 hover:scale-105 transition-transform">
                                    Join Now
                                </button>
                                <Menu className="lg:hidden w-6 h-6 text-white cursor-pointer" />
                            </div>
                        </div>
                    </nav>

                    {/* Hero Section */}
                    <header className="relative h-screen flex items-center overflow-hidden">
                        <div className="absolute inset-0 z-0">
                            <img 
                                src="https://images.unsplash.com/photo-1485846234645-a62644f84728?auto=format&fit=crop&q=80&w=2059" 
                                className="w-full h-full object-cover opacity-30 animate-slow-zoom" 
                                alt="Cinematic Background" 
                                referrerPolicy="no-referrer"
                            />
                            <div className="absolute inset-0 bg-gradient-to-t from-charcoal via-charcoal/40 to-transparent" />
                            <div className="absolute inset-0 bg-gradient-to-r from-charcoal via-transparent to-transparent" />
                        </div>

                        <div className="container mx-auto px-6 relative z-10 pt-20">
                            <motion.div
                                initial={{ opacity: 0, y: 30 }}
                                animate={{ opacity: 1, y: 0 }}
                                transition={{ duration: 0.8 }}
                                className="max-w-4xl"
                            >
                                <div className="inline-flex items-center gap-2 px-4 py-2 bg-gold/10 border border-gold/20 rounded-full mb-8">
                                    <Sparkles className="w-4 h-4 text-gold" />
                                    <span className="text-gold text-xs font-bold tracking-widest uppercase">Premium Media Production</span>
                                </div>
                                
                                <h1 className="text-5xl md:text-7xl lg:text-8xl font-serif font-bold text-white leading-[1.1] mb-8">
                                    Commercial <span className="italic text-gold">Production</span> & Filmmaking.
                                </h1>
                                
                                <p className="text-xl md:text-2xl text-white/60 font-light leading-relaxed mb-12 max-w-2xl border-l-2 border-gold/30 pl-8">
                                    From concept and screenwriting to cinematography, editing, content creation, podcasting, and professional voiceover.
                                </p>

                                <div className="flex flex-col sm:flex-row gap-6">
                                    <button className="px-10 py-5 gold-gradient text-charcoal font-bold text-lg rounded-full flex items-center justify-center gap-3 shadow-2xl shadow-gold/30 hover:scale-105 transition-transform group">
                                        <Play className="w-5 h-5 fill-current" />
                                        Explore Our Work
                                    </button>
                                    <button className="px-10 py-5 glass border border-gold/20 text-white font-bold text-lg rounded-full hover:bg-white/5 transition-colors">
                                        Request Consultation
                                    </button>
                                </div>
                            </motion.div>
                        </div>
                    </header>

                    <main className="py-24 space-y-32">
                        {/* Academy */}
                        <section id="academy" className="container mx-auto px-6">
                            <SectionHeading subtitle="Professional Education">Training Academy</SectionHeading>
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-8">
                                {[
                                    { id: 1, title: "Photography", img: "https://images.unsplash.com/photo-1493863641943-9b68992a8d07?auto=format&fit=crop&q=80&w=2058", icon: Camera },
                                    { id: 2, title: "Directing", img: "https://images.unsplash.com/photo-1478720568477-152d9b164e26?auto=format&fit=crop&q=80&w=2070", icon: Film },
                                    { id: 3, title: "Screenwriting", img: "https://images.unsplash.com/photo-1512486133939-0c45c0ec66aa?auto=format&fit=crop&q=80&w=1780", icon: PenTool },
                                ].map((course) => (
                                    <GlassCard key={course.id} className="group cursor-pointer aspect-square">
                                        <div className="absolute inset-0 z-0">
                                            <img src={course.img} alt={course.title} className="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110 opacity-40" referrerPolicy="no-referrer" />
                                            <div className="absolute inset-0 bg-gradient-to-t from-charcoal via-charcoal/40 to-transparent" />
                                        </div>
                                        <LockedOverlay />
                                        <div className="relative z-10 h-full flex flex-col justify-end">
                                            <div className="mb-4">
                                                <course.icon className="w-10 h-10 text-gold mb-4" />
                                                <h3 className="text-2xl font-bold font-serif mb-2">{course.title}</h3>
                                                <p className="text-white/60 text-sm">Master the art and craft with world-class mentors.</p>
                                            </div>
                                            <div className="flex items-center gap-2 text-gold font-bold text-sm tracking-widest uppercase opacity-0 group-hover:opacity-100 transition-opacity">
                                                Access Course <ChevronRight className="w-4 h-4" />
                                            </div>
                                        </div>
                                    </GlassCard>
                                ))}
                            </div>
                        </section>

                        {/* Script Lab */}
                        <section id="script-lab" className="container mx-auto px-6">
                            <div className="grid grid-cols-1 lg:grid-cols-2 gap-16 items-center">
                                <motion.div
                                    initial={{ opacity: 0, x: -30 }}
                                    whileInView={{ opacity: 1, x: 0 }}
                                    viewport={{ once: true }}
                                >
                                    <SectionHeading subtitle="Creative Engine">Script Lab</SectionHeading>
                                    <p className="text-xl text-white/60 mb-8 leading-relaxed">
                                        An advanced module for script refinement. Specialist rewriting and professional polishing by expert committees ensure your story reaches its fullest potential.
                                    </p>
                                    
                                    <div className="space-y-6 mb-12">
                                        <div className="flex items-start gap-4">
                                            <div className="w-12 h-12 rounded-xl bg-gold/10 border border-gold/20 flex items-center justify-center shrink-0">
                                                <Database className="w-6 h-6 text-gold" />
                                            </div>
                                            <div>
                                                <h4 className="text-lg font-bold mb-1">Script & Idea Bank</h4>
                                                <p className="text-white/50 text-sm uppercase tracking-wider">Showcasing hundreds of concepts for ads and content.</p>
                                            </div>
                                        </div>
                                    </div>

                                    <div className="flex flex-wrap gap-4 mb-12">
                                        <button className="px-8 py-4 gold-gradient text-charcoal font-bold rounded-xl shadow-lg shadow-gold/20 hover:scale-105 transition-transform">
                                            Professional Subscription
                                        </button>
                                        <button className="px-8 py-4 glass border border-gold/20 text-white font-bold rounded-xl hover:bg-white/5 transition-all">
                                            Script Marketing
                                        </button>
                                    </div>

                                    <div className="relative overflow-hidden group">
                                        <div className="absolute inset-y-0 left-0 w-8 bg-gradient-to-r from-charcoal to-transparent z-10" />
                                        <div className="absolute inset-y-0 right-0 w-8 bg-gradient-to-l from-charcoal to-transparent z-10" />
                                        <div className="flex gap-4 animate-marquee whitespace-nowrap">
                                            {[
                                                "Sustainable Tech Ad", "Noir Thriller Concept", "Arabic Coffee Documentary", 
                                                "Futuristic Banking App Commercial", "Historical Drama Series", "Cyberpunk Shorts",
                                                "Luxury Watch Promo", "Desert Adventure Docuseries", "Urban Streetwear Campaign"
                                            ].map((idea, idx) => (
                                                <div key={idx} className="px-4 py-2 glass border border-gold/10 rounded-lg text-[10px] font-bold text-gold/60 uppercase tracking-widest">
                                                    {idea}
                                                </div>
                                            ))}
                                            {/* Duplicate for marquee */}
                                            {[
                                                "Sustainable Tech Ad", "Noir Thriller Concept", "Arabic Coffee Documentary", 
                                                "Futuristic Banking App Commercial", "Historical Drama Series", "Cyberpunk Shorts"
                                            ].map((idea, idx) => (
                                                <div key={`dup-${idx}`} className="px-4 py-2 glass border border-gold/10 rounded-lg text-[10px] font-bold text-gold/60 uppercase tracking-widest">
                                                    {idea}
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                </motion.div>

                                <div className="grid grid-cols-2 gap-6 relative">
                                    <div className="absolute inset-0 bg-gold/10 blur-3xl rounded-full translate-x-1/2 -translate-y-1/2" />
                                    <GlassCard className="translate-y-12 h-64 flex flex-col justify-center items-center text-center">
                                        <div className="w-16 h-16 rounded-full bg-gold/20 flex items-center justify-center mb-4">
                                            <Search className="w-8 h-8 text-gold" />
                                        </div>
                                        <h4 className="font-bold mb-2">Specialist Rewriting</h4>
                                        <p className="text-xs text-white/40 uppercase tracking-widest leading-relaxed px-4">Technical storytelling analysis</p>
                                    </GlassCard>
                                    <GlassCard className="h-64 flex flex-col justify-center items-center text-center">
                                        <div className="w-16 h-16 rounded-full bg-gold/20 flex items-center justify-center mb-4">
                                            <Star className="w-8 h-8 text-gold" />
                                        </div>
                                        <h4 className="font-bold mb-2">Idea Bank</h4>
                                        <p className="text-xs text-white/40 uppercase tracking-widest leading-relaxed px-4">Exclusive concept archive</p>
                                    </GlassCard>
                                </div>
                            </div>
                        </section>

                        {/* Casting Center */}
                        <section id="casting" className="container mx-auto px-6 overflow-hidden">
                            <SectionHeading subtitle="Talent Discovery">Casting Center</SectionHeading>
                            
                            <div className="flex gap-4 mb-10 overflow-x-auto pb-4 scrollbar-hide">
                                {["All Tiers", "Star 1", "Star 2", "Member", "Trainee"].map((tier) => (
                                    <button 
                                        key={tier}
                                        onClick={() => setActiveTab(tier.toLowerCase())}
                                        className={`px-6 py-2 rounded-full border text-sm font-bold tracking-widest uppercase transition-all shrink-0 ${
                                            activeTab === tier.toLowerCase() 
                                            ? 'bg-gold border-gold text-charcoal' 
                                            : 'bg-transparent border-white/10 text-white/50 hover:border-gold/30 hover:text-white'
                                        }`}
                                    >
                                        {tier}
                                    </button>
                                ))}
                            </div>

                            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8">
                                {[
                                    { name: "Sarah Al-Faruq", tier: "Star 1", role: "Protagonist", img: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&q=80&w=1964" },
                                    { name: "Khalid Mansour", tier: "Star 2", role: "Voice Actor", img: "https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?auto=format&fit=crop&q=80&w=1887" },
                                    { name: "Omar Zayed", tier: "Member", role: "Background", img: "https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&q=80&w=1887" },
                                    { name: "Lina Hassan", tier: "Trainee", role: "Extra", img: "https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&q=80&w=1887" },
                                ].map((talent, i) => (
                                    <GlassCard key={i} className="group p-0">
                                        <div className="relative aspect-[3/4] overflow-hidden">
                                            <img src={talent.img} alt={talent.name} className="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110" referrerPolicy="no-referrer" />
                                            <div className="absolute inset-0 bg-gradient-to-t from-charcoal via-transparent to-transparent" />
                                            <div className="absolute top-4 left-4">
                                                <span className="px-3 py-1 bg-gold/90 text-charcoal text-[10px] font-black uppercase tracking-tighter rounded-sm shadow-xl">
                                                    {talent.tier}
                                                </span>
                                            </div>
                                        </div>
                                        <div className="p-6">
                                            <h4 className="text-xl font-bold font-serif mb-1">{talent.name}</h4>
                                            <p className="text-white/40 text-xs uppercase tracking-widest mb-6">{talent.role}</p>
                                            
                                            <div className="space-y-2 mb-6">
                                                <div className="flex justify-between items-center text-[10px] text-gold font-bold uppercase tracking-widest">
                                                    <span>Voice Preview</span>
                                                    <Volume2 className="w-3 h-3" />
                                                </div>
                                                <div className="flex items-end gap-1 h-8">
                                                    {Array.from({ length: 24 }).map((_, j) => (
                                                        <div 
                                                            key={j} 
                                                            className="w-1 bg-gold/30 rounded-full" 
                                                            style={{ height: `${Math.random() * 100}%` }}
                                                        />
                                                    ))}
                                                </div>
                                            </div>

                                            <button className="w-full py-3 glass border border-gold/20 text-gold text-[10px] font-black uppercase tracking-widest rounded-lg flex items-center justify-center gap-2 group-hover:bg-gold group-hover:text-charcoal transition-all">
                                                <Lock className="w-3 h-3" />
                                                View More
                                            </button>
                                        </div>
                                    </GlassCard>
                                ))}
                            </div>
                        </section>

                        {/* Audio Lab */}
                        <section id="audio-lab" className="relative py-24 overflow-hidden">
                            <div className="absolute inset-0 bg-gold/5 blur-[120px] rounded-full -left-1/4" />
                            <div className="container mx-auto px-6 flex flex-col items-center text-center relative z-10">
                                <SectionHeading subtitle="The Sonic signature">Spiritual Sound Studio</SectionHeading>
                                <p className="text-2xl md:text-3xl font-serif text-gold italic mb-12 max-w-3xl leading-relaxed">
                                    "We design sound with the same precision as a physical product."
                                </p>

                                <div className="w-full max-w-5xl grid grid-cols-1 md:grid-cols-3 gap-12 mb-20 text-left">
                                    {[
                                        { title: "Tone Design", icon: Headphones, desc: "Architecting the perfect frequency for your brand message." },
                                        { title: "Accents Lab", icon: Mic, desc: "Specialized localization and cultural linguistic authenticity." },
                                        { title: "Specialized Apps", icon: Volume2, desc: "Interactive audio solutions for modern digital infrastructure." },
                                    ].map((item, i) => (
                                        <div key={i} className="space-y-4">
                                            <div className="w-16 h-16 rounded-2xl glass border border-gold/20 flex items-center justify-center shadow-xl shadow-gold/5">
                                                <item.icon className="w-8 h-8 text-gold" />
                                            </div>
                                            <h4 className="text-xl font-bold">{item.title}</h4>
                                            <p className="text-white/50 text-sm leading-relaxed">{item.desc}</p>
                                        </div>
                                    ))}
                                </div>

                                <div className="flex items-center gap-1.5 h-48 w-full max-w-3xl">
                                    {Array.from({ length: 48 }).map((_, i) => (
                                        <motion.div 
                                            key={i}
                                            animate={{ 
                                                height: [
                                                    Math.random() * 80 + 20 + "%", 
                                                    Math.random() * 80 + 20 + "%", 
                                                    Math.random() * 80 + 20 + "%"
                                                ] 
                                            }}
                                            transition={{ repeat: Infinity, duration: Math.random() * 1 + 0.5, ease: "easeInOut" }}
                                            className="flex-1 bg-gradient-to-t from-gold via-gold/50 to-gold/10 rounded-full"
                                        />
                                    ))}
                                </div>
                            </div>
                        </section>

                        {/* Subscription */}
                        <section id="subscription" className="container mx-auto px-6">
                            <SectionHeading subtitle="Become a Member">Subscription Hub</SectionHeading>
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-8">
                                {[
                                    { 
                                        plan: "Pro Access", 
                                        price: "$49", 
                                        desc: "Unlock individual academy windows and casting previews.",
                                        features: ["Academy Access", "Casting Database", "Self-Submission"]
                                    },
                                    { 
                                        plan: "Premium Studio", 
                                        price: "$129", 
                                        desc: "Full access to Script Lab and high-end talent scouting tools.",
                                        features: ["Full Academy Access", "Casting Search", "Script & Idea Bank", "Priority Listing"],
                                        featured: true
                                    },
                                    { 
                                        plan: "Enterprise MAP", 
                                        price: "$499", 
                                        desc: "Custom production workflows and direct sound studio sessions.",
                                        features: ["Custom Consulting", "Production Support", "Voiceover Discounts", "Dedicated Manager"]
                                    },
                                ].map((tier, i) => (
                                    <GlassCard 
                                        key={i} 
                                        className={`relative flex flex-col p-10 border-2 ${tier.featured ? 'border-gold scale-105 z-10' : 'border-gold/10'}`}
                                    >
                                        {tier.featured && (
                                            <div className="absolute -top-4 left-1/2 -translate-x-1/2 bg-gold text-charcoal text-[10px] font-black uppercase tracking-[0.2em] px-4 py-1.5 rounded-full shadow-lg">
                                                Recommended
                                            </div>
                                        )}
                                        <div className="mb-8">
                                            <h3 className="text-2xl font-bold mb-2">{tier.plan}</h3>
                                            <div className="flex items-baseline gap-1">
                                                <span className="text-4xl font-serif font-black gold-text-gradient">{tier.price}</span>
                                                <span className="text-white/40 text-sm font-medium">/month</span>
                                            </div>
                                        </div>
                                        <p className="text-white/60 text-sm mb-10 leading-relaxed">{tier.desc}</p>
                                        <div className="space-y-4 mb-12 flex-grow">
                                            {tier.features.map((f) => (
                                                <div key={f} className="flex items-center gap-3">
                                                    <CheckCircle2 className="w-4 h-4 text-gold shrink-0" />
                                                    <span className="text-sm font-medium text-white/80">{f}</span>
                                                </div>
                                            ))}
                                        </div>
                                        <button className={`w-full py-4 rounded-xl font-bold transition-all ${tier.featured ? 'gold-gradient text-charcoal' : 'glass border border-gold/20 text-white hover:bg-white/5'}`}>
                                            Get Started
                                        </button>
                                    </GlassCard>
                                ))}
                            </div>
                        </section>
